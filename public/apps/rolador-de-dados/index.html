<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rolador de dados</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Rolador de dados</h1>
    <form id="form" class="controls" autocomplete="off">
      <label>Quantidade
        <input id="qty" type="number" min="1" max="20" value="1" inputmode="numeric">
      </label>
      <label>Dado
        <select id="sides">
          <option>4</option><option>6</option><option>8</option><option>10</option>
          <option>12</option><option selected>20</option><option>100</option>
        </select>
      </label>
      <label>Modificador
        <input id="mod" type="number" min="-99" max="99" value="0" inputmode="numeric">
      </label>
      <button type="submit">Rolar</button>
    </form>

    <section class="result" aria-live="polite" aria-atomic="true">
      <p class="total" id="total">–</p>
      <p class="detail" id="detail">Escolha os dados e role.</p>
    </section>

    <section class="history">
      <div class="history-head">
        <h2>Histórico</h2>
        <button type="button" id="clear" class="link">Limpar</button>
      </div>
      <ol id="log" class="log"></ol>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
